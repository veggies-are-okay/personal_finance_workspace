[project]
name = "personal-finance-api"
version = "0.1.0"
description = "FastAPI backend for the personal finance app. Mirrors backend-ts/ at strict 1:1 parity (see .claude/rules/backend-parity.md)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing:skip-covered --cov-branch --cov-fail-under=80"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: tests that round-trip a real database (run by default; skipped with --fast)",
]
