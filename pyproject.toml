[project]
name = "personal-finance-ingest"
version = "0.1.0"
description = "Repo-level data-prep utilities: parse raw bank/credit statements (CSV + PDF) into normalized CSV ledgers consumed by the backends."
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
eda = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
    "numpy>=2.4.6",
    "plotly>=6.7.0",
    "rapidfuzz>=3.14.5",
    "seaborn>=0.13.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
